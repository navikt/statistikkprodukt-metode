definisjon:
  id: NAV21001
  obt-tabell: obt_befolkning

  navn: Befolkning etter kjønn
  navn-en: Population by sex
  innhold: Befolkning fordelt etter periode og kjønn.
  innhold-en: Population by period and sex.

  periodisering:
    navn: Periode
    navn-en: Period
    kolonne: periode
    innhold: Månedsperiode på formatet YYYYMM.
    innhold-en: Month in YYYYMM format.

  teller:
    - navn: Antall personer
      navn-en: Number of people
      kolonne: antall
      innhold: Antall personer i gruppen.
      innhold-en: Number of people in the group.

  variabler:
    - navn: Kjønn
      navn-en: Sex
      kolonne: kjonn
      innhold: Fordelt på kjønn.
      innhold-en: Distributed by sex.

  inkrementell-strategi: overskriv_alt

  formula: "~ periode : kjonn"
  prikking: true
  saerskilt: false
