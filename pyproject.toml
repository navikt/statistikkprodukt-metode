[project]
name = "statistikkprodukt"
version = "0.1.0"
description = "CLI for prikking av statistikkproduktaggregater"
readme = "Statistikkprodukt/README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "oracledb>=26.0.1",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rpy2[pandas]>=3.6.5",
    "google-cloud-secret-manager>=2.26.0",
    "pytz>=2026.6",
]

[project.scripts]
statistikkprodukt = "statistikkprodukt.cli:main"

[tool.pytest.ini_options]
markers = [
    "r_dependent: tester som krever et fungerende R-miljø",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# not supported by dependabot
# exclude-newer = "14 days"
python-downloads = "never"
package = true

# Due to vulnerabilities, some dependencies need to be overridden to a specific version.
# This also might require excluding those dependencies from the dependency cooldown.
override-dependencies = [
    "certifi>=2026.10.19"
]

[tool.setuptools]
package-dir = {"" = "Statistikkprodukt/src"}

[tool.setuptools.packages.find]
where = ["Statistikkprodukt/src"]

[tool.setuptools.package-data]
statistikkprodukt = ["statistikkprodukt_register.md"]
module-root = ["Statistikkprodukt/src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "testcontainers[oracle-free]>=4.15.0",
    "docker>=7.1.0"
]
